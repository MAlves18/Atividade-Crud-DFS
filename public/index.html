<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de alunos - SENAI</title><link rel="stylesheet" href="/css/style.css"></head><body><main><h1>Cadastro de alunos</h1><p>Atividade prática: Node.js + Express + TypeScript + MySQL</p><form id="form"><label>Nome<input id="nome" maxlength="120" required></label><label>E-mail<input id="email" type="email" maxlength="160" required></label><label>Curso<input id="curso" maxlength="120" required></label><button type="submit">Cadastrar</button></form><p id="mensagem" role="status" aria-live="polite"></p><section><h2>Alunos cadastrados</h2><div class="toolbar"><input id="busca" placeholder="Buscar por nome ou e-mail" aria-label="Buscar alunos"><button id="limpar" type="button">Limpar</button></div><div class="tabela"><table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Curso</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></section></main><script type="module" src="/js/app.js"></script></body></html>
